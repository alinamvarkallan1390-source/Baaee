# ════════════════════════════════════════════════════
#  ⚙️ fly.toml — تنظیمات اجرای ربات روی fly.io
#  🆕 حالا با دیسک دائمی (Volume) — سیوها دیگه پاک نمی‌شن!
# ════════════════════════════════════════════════════
app = 'baaee-8oen6w'
primary_region = 'ams'

[env]
  PORT = '8080'
  LIFE_SIM_DB = '/data/life_simulator.db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

# 💾 دیسک دائمی — دیتابیس اینجا ذخیره می‌شه و با Restart/Redeploy پاک نمی‌شه
[mounts]
  source = 'baaee_data'
  destination = '/data'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
