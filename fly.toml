# ════════════════════════════════════════════════════
#  ⚙️ fly.toml — تنظیمات اجرای ربات روی fly.io
# ════════════════════════════════════════════════════
app = 'baaee'
primary_region = 'ams'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  
